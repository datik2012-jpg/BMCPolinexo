name: macOS installer

on:
  workflow_dispatch:
  push:
    branches: [feature/mac-installer]
    paths:
      - '.github/workflows/macos-installer.yml'
      - 'backend/**'
      - 'desktop/**'
      - 'frontend/**'
      - 'packaging/macos/**'
      - 'tests/**'

permissions:
  contents: read

concurrency:
  group: macos-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Apple-silicon runner
        run: test "$(uname -m)" = arm64
      - name: Install test dependencies
        run: |
          python -m venv .test-venv
          .test-venv/bin/python -m pip install -r tests/requirements.txt
          .test-venv/bin/python -m playwright install chromium
      - name: Backend checks
        working-directory: backend
        run: ../.test-venv/bin/python -m pytest -q
      - name: Build signed app and DMG
        run: python packaging/macos/build.py
      - name: Frontend checks
        working-directory: frontend
        run: npm test
      - name: Verify installed DMG, browser workflows and process lifecycle
        run: .test-venv/bin/python tests/macos_package_check.py
      - name: Upload verified installer
        uses: actions/upload-artifact@v4
        with:
          name: BMCPolinexo-1.2.2-macos-arm64
          path: dist/releases/1.2.2-macos-arm64/
          if-no-files-found: error
          retention-days: 30
